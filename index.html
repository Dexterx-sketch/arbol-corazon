<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo está aquí</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#040506;
      --cream:#f8e8de;
      --ink:#3d3028;
      --green:#18b98d;
      --green-dark:#119572;
      --pink:#ff4da6;
      --pink2:#ff77c8;
      --red:#ff5e6d;
      --yellow:#ffe15c;
      --orange:#ff9f43;
      --purple:#d76dff;
      --white:#fff;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      font-family:"Nunito", sans-serif;
      color:#fff;
      background:linear-gradient(rgba(0,0,0,.48), rgba(0,0,0,.82)), var(--bg);
      overflow-x:hidden;
    }

    .bg{
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.14;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 78px),
        repeating-linear-gradient(180deg, rgba(255,255,255,.025) 0 2px, transparent 2px 50px);
    }

    .bg::before{
      content:"const love = true; function heartTree(){} html css js object content clone value code romantic memory animation";
      position:absolute;
      inset:0;
      color:rgba(255,255,255,.14);
      font-family:"Fira Code", monospace;
      font-size:32px;
      line-height:2.35;
      padding:20px;
      word-break:break-word;
      filter:blur(1px);
    }

    .app{
      width:min(980px, 96vw);
      margin:0 auto;
      padding:24px 0 40px;
      position:relative;
      z-index:2;
    }

    .brand{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:2px;
      margin-bottom:10px;
    }

    .logo{
      position:relative;
      width:70px;
      height:70px;
    }

    .logo::before{
      content:"";
      position:absolute;
      left:50%;
      top:4px;
      transform:translateX(-50%);
      width:48px;
      height:48px;
      border:7px solid #fff;
      border-radius:22px 22px 34px 34px;
      clip-path:polygon(50% 0, 100% 100%, 74% 100%, 61% 73%, 39% 73%, 26% 100%, 0 100%);
    }

    .logo::after{
      content:"";
      position:absolute;
      left:50%;
      top:28px;
      transform:translateX(-50%);
      width:14px;
      height:14px;
      border-radius:50%;
      background:#fff;
    }

    .brand span{
      font-size:18px;
      font-weight:800;
      letter-spacing:2px;
    }

    .labels{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      text-align:center;
      font-family:"Fira Code", monospace;
      font-size:24px;
      margin-bottom:18px;
      max-width:560px;
      margin-left:auto;
      margin-right:auto;
    }

    .stage{
      width:fit-content;
      margin:0 auto;
      position:relative;
    }

    .card{
      position:relative;
      width:min(560px, 92vw);
      background:var(--cream);
      color:var(--ink);
      border-radius:30px;
      min-height:560px;
      overflow:hidden;
      box-shadow:0 18px 40px rgba(0,0,0,.34);
      padding:18px 18px 28px;
    }

    .layout{
      display:grid;
      grid-template-columns:1fr 1.22fr;
      gap:4px;
      min-height:470px;
      align-items:start;
    }

    .text{
      padding:18px 8px 0 10px;
      align-self:start;
      position:relative;
      z-index:5;
      opacity:0;
      transform:translateY(6px);
      transition:opacity .5s ease, transform .5s ease;
      min-height:280px;
    }

    .text.show{
      opacity:1;
      transform:translateY(0);
    }

    .text h2{
      font-size:17px;
      margin-bottom:14px;
      font-weight:800;
      min-height:26px;
    }

    .line-slot{
      display:block;
      min-height:170px;
    }

    .line{
      font-size:15px;
      line-height:1.42;
      margin-bottom:10px;
      min-height:24px;
    }

    .sign{
      margin-top:12px;
      text-align:right;
      font-weight:800;
      font-size:16px;
      min-height:24px;
    }

    .scene{
      position:relative;
      min-height:470px;
      overflow:visible;
    }

    .canopy{
      position:absolute;
      left:50%;
      bottom:110px;
      width:370px;
      height:325px;
      transform:translateX(-50%);
      z-index:1;
      overflow:visible;
    }

    .leaf{
      position:absolute;
      transform:translate(-50%,-50%) scale(.1) rotate(var(--rot));
      opacity:0;
      line-height:1;
      filter:drop-shadow(0 3px 5px rgba(0,0,0,.12));
      will-change:transform, opacity;
    }

    .leaf.show{
      animation:popLeaf .34s ease-out forwards;
    }

    @keyframes popLeaf{
      0%{
        opacity:0;
        transform:translate(-50%,-35%) scale(.1) rotate(var(--rot));
      }
      100%{
        opacity:1;
        transform:translate(-50%,-50%) scale(var(--scale)) rotate(var(--rot));
      }
    }

    .falling{
      position:absolute;
      left:0;
      top:0;
      line-height:1;
      pointer-events:none;
      z-index:6;
      filter:drop-shadow(0 4px 5px rgba(0,0,0,.13));
      animation:fallLeft linear forwards;
    }

    @keyframes fallLeft{
      0%{
        transform:translate(0,0) rotate(0deg);
        opacity:1;
      }
      15%{
        transform:translate(-22px,24px) rotate(-25deg);
        opacity:1;
      }
      30%{
        transform:translate(-48px,60px) rotate(-70deg);
        opacity:1;
      }
      45%{
        transform:translate(-80px,108px) rotate(-120deg);
        opacity:.98;
      }
      60%{
        transform:translate(-118px,158px) rotate(-175deg);
        opacity:.94;
      }
      75%{
        transform:translate(-150px,214px) rotate(-230deg);
        opacity:.85;
      }
      100%{
        transform:translate(-195px,288px) rotate(-300deg);
        opacity:0;
      }
    }

    .tree{
      position:absolute;
      left:50%;
      bottom:24px;
      transform:translateX(-50%);
      width:255px;
      height:360px;
      overflow:visible;
      z-index:2;
    }

    .trunk{
      fill:url(#trunkGrad);
      transform-origin:center bottom;
      transform-box:fill-box;
      transform:scaleY(0);
    }

    .tree.start .trunk{
      animation:growTrunk 1.9s cubic-bezier(.22,1,.36,1) forwards;
    }

    .branch{
      fill:none;
      stroke:var(--green);
      stroke-width:7;
      stroke-linecap:round;
      stroke-linejoin:round;
      stroke-dasharray:240;
      stroke-dashoffset:240;
    }

    .tree.start .b1{ animation:draw .55s .55s ease forwards; }
    .tree.start .b2{ animation:draw .55s .75s ease forwards; }
    .tree.start .b3{ animation:draw .55s .95s ease forwards; }
    .tree.start .b4{ animation:draw .55s 1.15s ease forwards; }
    .tree.start .b5{ animation:draw .55s 1.35s ease forwards; }
    .tree.start .b6{ animation:draw .55s 1.52s ease forwards; }

    @keyframes growTrunk{
      to{ transform:scaleY(1); }
    }

    @keyframes draw{
      to{ stroke-dashoffset:0; }
    }

    .counter-box{
      position:absolute;
      left:18px;
      bottom:28px;
      z-index:7;
      opacity:0;
      transform:translateY(8px);
      transition:.45s ease;
    }

    .counter-box.show{
      opacity:1;
      transform:translateY(0);
    }

    .counter-title{
      font-size:14px;
      font-weight:800;
      margin-bottom:4px;
    }

    .counter{
      font-size:16px;
      font-weight:800;
      color:#322821;
    }

    .counter .n{
      font-size:22px;
    }

    .ground{
      position:absolute;
      left:14px;
      right:14px;
      bottom:20px;
      height:3px;
      border-radius:999px;
      background:#222;
    }

    .inside-starter{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      z-index:12;
      background:rgba(248,232,222,.18);
      backdrop-filter:blur(1.5px);
      transition:opacity .45s ease, visibility .45s ease;
    }

    .inside-starter.hide{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .inside-starter.drop{
      animation:starterDrop .95s cubic-bezier(.22,1,.36,1) forwards;
    }

    @keyframes starterDrop{
      0%{
        transform:translateY(0) scale(1);
        opacity:1;
      }
      30%{
        transform:translateY(18px) scale(.98);
        opacity:1;
      }
      100%{
        transform:translateY(250px) scale(.82);
        opacity:0;
      }
    }

    .heart-btn{
      width:54px;
      height:54px;
      border:none;
      border-radius:50%;
      cursor:pointer;
      background:linear-gradient(180deg, #ff6ab8, #ff3d93);
      box-shadow:0 10px 24px rgba(255,77,166,.28);
      position:relative;
      transition:transform .2s ease, box-shadow .2s ease;
      flex:0 0 auto;
    }

    .heart-btn:hover{
      transform:scale(1.05);
      box-shadow:0 14px 28px rgba(255,77,166,.34);
    }

    .heart-btn::before{
      content:"❤";
      color:#fff;
      font-size:22px;
      line-height:1;
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
    }

    .inside-text{
      font-size:22px;
      font-weight:800;
      color:#fff;
      text-shadow:0 3px 10px rgba(0,0,0,.28);
    }

    .replay-area{
      position:absolute;
      left:calc(100% + 18px);
      top:50%;
      transform:translateY(-50%);
      display:flex;
      align-items:center;
      gap:12px;
      opacity:0;
      pointer-events:none;
      transition:opacity .45s ease, transform .45s ease;
      z-index:20;
    }

    .replay-area.show{
      opacity:1;
      pointer-events:auto;
      transform:translateY(-50%);
    }

    .replay-text{
      font-weight:800;
      font-size:17px;
      color:#fff;
      max-width:170px;
      line-height:1.25;
      text-align:left;
    }

    audio{
      display:none;
    }

    @media (max-width:820px){
      .stage{
        width:100%;
      }

      .replay-area{
        position:static;
        transform:none;
        justify-content:center;
        margin-top:16px;
      }

      .replay-area.show{
        transform:none;
      }
    }

    @media (max-width:560px){
      .app{ width:96vw; }
      .card{ width:100%; min-height:530px; }
      .labels{ font-size:22px; }
      .layout{ min-height:448px; }
      .text h2{ font-size:16px; }
      .line{ font-size:14px; }
      .scene{ min-height:448px; }
      .canopy{
        width:325px;
        height:300px;
        bottom:106px;
      }
      .tree{
        width:230px;
        height:340px;
      }
      .inside-text{
        font-size:18px;
      }
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <main class="app">
    <div class="brand">
      <div class="logo"></div>
      <span>DEV</span>
    </div>

    <div class="labels">
      <div>Html</div>
      <div>Css</div>
      <div>Js</div>
    </div>

    <div class="stage">
      <section class="card">
        <div class="inside-starter" id="insideStarter">
          <button class="heart-btn" id="startBtn" aria-label="Iniciar animación"></button>
          <div class="inside-text">todo está aquí</div>
        </div>

        <div class="layout">
          <div class="text" id="textBox">
            <h2 id="titleLine"></h2>
            <div class="line-slot" id="msg"></div>
            <div class="sign" id="sign"></div>
          </div>

          <div class="scene" id="scene">
            <div class="canopy" id="canopy"></div>

            <svg class="tree" id="tree" viewBox="0 0 240 320" aria-hidden="true">
              <defs>
                <linearGradient id="trunkGrad" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0%" stop-color="#18b98d"/>
                  <stop offset="100%" stop-color="#119572"/>
                </linearGradient>
              </defs>

              <path class="trunk" d="M108 308 L123 152 L146 104 L139 308 Z"></path>
              <path class="branch b1" d="M126 193 C105 167, 89 145, 70 123"></path>
              <path class="branch b2" d="M127 177 C122 146, 118 112, 112 78"></path>
              <path class="branch b3" d="M128 186 C146 160, 162 140, 179 119"></path>
              <path class="branch b4" d="M116 152 C98 136, 80 122, 60 114"></path>
              <path class="branch b5" d="M120 118 C108 96, 98 74, 88 50"></path>
              <path class="branch b6" d="M123 110 C129 82, 132 52, 128 24"></path>
            </svg>
          </div>
        </div>

        <div class="counter-box" id="counterBox">
          <div class="counter-title">Mi amor por ti comenzó hace...</div>
          <div class="counter" id="counter"></div>
        </div>

        <div class="ground"></div>
      </section>

      <div class="replay-area" id="replayArea">
        <div class="replay-text">¿quieres volver a intentar?</div>
        <button class="heart-btn" id="restartBtn" aria-label="Reiniciar animación"></button>
      </div>
    </div>
  </main>

  <audio id="bgMusic" preload="auto" loop controls>
  <source src="https://drive.google.com/file/d/1I0YdBhXv9nZkH6c5QEJja5K9D3vrW9ks/view" type="audio/mpeg">
  Tu navegador no soporta audio HTML.
</audio>

  <script>
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const insideStarter = document.getElementById("insideStarter");
    const replayArea = document.getElementById("replayArea");
    const canopy = document.getElementById("canopy");
    const textBox = document.getElementById("textBox");
    const titleLine = document.getElementById("titleLine");
    const msg = document.getElementById("msg");
    const sign = document.getElementById("sign");
    const counterBox = document.getElementById("counterBox");
    const counter = document.getElementById("counter");
    const scene = document.getElementById("scene");
    const bgMusic = document.getElementById("bgMusic");

    const startDate = new Date("2025-05-14T00:00:00");

    const titleText = "Para el amor de mi vida:";
    const messageLines = [
      "Si pudiera elegir un lugar seguro, sería a tu lado.",
      "Cuanto más tiempo estoy contigo, más bonito se siente todo.",
      "Eres calma, ternura y hogar en mi corazón."
    ];
    const signText = "— I Love You!";

    const colors = [
      "#ff4da6","#ff77c8","#ff5e6d","#ffe15c",
      "#ff9f43","#d76dff","#ff9ccb","#ffc95b",
      "#ff7f86","#ffb3d1","#f95d9b","#ffd95a"
    ];
    const symbols = ["❤","♥","❤","♥"];

    const totalLeaves = window.innerWidth < 600 ? 420 : 900;
    let leavesData = [];
    let fallingInterval = null;
    let counterInterval = null;
    let isRunning = false;
    let currentTree = document.getElementById("tree");

    function wait(ms){
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function heartPoint(t, scale = 9.6){
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      return { x: x * scale, y: -y * scale };
    }

    function randomHeartFillPoint(){
      const t = Math.random() * Math.PI * 2;
      const edge = heartPoint(t, 9.6);
      const shrink = Math.sqrt(Math.random()) * 0.995;
      const x = edge.x * shrink + (Math.random() - .5) * 7;
      const y = edge.y * shrink + (Math.random() - .5) * 7;
      return { x, y };
    }

    function buildLeafData(){
      leavesData = [];
      for(let i = 0; i < totalLeaves; i++){
        leavesData.push(randomHeartFillPoint());
      }
      leavesData.sort((a,b) => {
        const da = Math.hypot(a.x, a.y + 20);
        const db = Math.hypot(b.x, b.y + 20);
        return da - db;
      });
    }

    function createLeaf(point){
      const el = document.createElement("span");
      el.className = "leaf";
      el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      el.style.left = `${182 + point.x}px`;
      el.style.top = `${135 + point.y}px`;
      el.style.fontSize = `${10 + Math.random() * 11}px`;
      el.style.color = colors[Math.floor(Math.random() * colors.length)];
      el.style.setProperty("--rot", `${-40 + Math.random() * 80}deg`);
      el.style.setProperty("--scale", `${0.75 + Math.random() * .95}`);
      canopy.appendChild(el);
      requestAnimationFrame(() => el.classList.add("show"));
    }

    async function fillHeart(){
      buildLeafData();
      for(let i = 0; i < leavesData.length; i++){
        createLeaf(leavesData[i]);
        await wait(5);
      }
    }

    function createFallingLeafPair(){
      const canopyLeaves = [...canopy.querySelectorAll(".leaf")];
      if(canopyLeaves.length < 2) return;

      for(let i = 0; i < 6; i++){
        const source = canopyLeaves[Math.floor(Math.random() * canopyLeaves.length)];
        if(!source) continue;

        const rect = source.getBoundingClientRect();
        const sceneRect = scene.getBoundingClientRect();

        const f = document.createElement("span");
        f.className = "falling";
        f.textContent = source.textContent;
        f.style.left = `${rect.left - sceneRect.left}px`;
        f.style.top = `${rect.top - sceneRect.top}px`;
        f.style.color = getComputedStyle(source).color;
        f.style.fontSize = `${parseFloat(getComputedStyle(source).fontSize) + (Math.random() * 4 - 1)}px`;
        f.style.animationDuration = `${3 + Math.random() * 1.6}s`;

        scene.appendChild(f);
        setTimeout(() => f.remove(), 5200);
      }
    }

    function startFallingLeaves(){
      fallingInterval = setInterval(createFallingLeafPair, 240);
    }

    function stopFallingLeaves(){
      if(fallingInterval){
        clearInterval(fallingInterval);
        fallingInterval = null;
      }
    }

    function updateCounter(){
      let diff = Date.now() - startDate.getTime();
      if(diff < 0) diff = 0;

      const s = Math.floor(diff / 1000);
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;

      counter.innerHTML = `
        <span class="n">${d}</span> días
        <span class="n">${h}</span> horas
        <span class="n">${m}</span> minutos
        <span class="n">${String(sec).padStart(2, "0")}</span> segundos
      `;
    }

    function startCounter(){
      updateCounter();
      counterInterval = setInterval(updateCounter, 1000);
    }

    function stopCounter(){
      if(counterInterval){
        clearInterval(counterInterval);
        counterInterval = null;
      }
    }

    async function typeSentence(el, text, speed = 150){
      const words = text.split(" ");
      for(let i = 0; i < words.length; i++){
        el.textContent += (i ? " " : "") + words[i];
        await wait(speed);
      }
    }

    async function writeMessage(){
      textBox.classList.add("show");

      titleLine.textContent = "";
      await typeSentence(titleLine, titleText, 165);
      await wait(250);

      msg.innerHTML = "";
      for(const lineText of messageLines){
        const line = document.createElement("div");
        line.className = "line";
        msg.appendChild(line);
        await typeSentence(line, lineText, 145);
        await wait(320);
      }

      sign.textContent = "";
      await typeSentence(sign, signText, 170);
    }

    function resetTreeAnimation(){
      const oldTree = document.getElementById("tree");
      const newTree = oldTree.cloneNode(true);
      oldTree.parentNode.replaceChild(newTree, oldTree);
      currentTree = newTree;
    }

    function clearScene(initial = false){
      stopFallingLeaves();
      stopCounter();

      canopy.innerHTML = "";
      scene.querySelectorAll(".falling").forEach(el => el.remove());

      textBox.classList.remove("show");
      titleLine.textContent = "";
      msg.innerHTML = "";
      sign.textContent = "";

      counterBox.classList.remove("show");
      counter.innerHTML = "";

      replayArea.classList.remove("show");
      insideStarter.classList.remove("hide", "drop");
      insideStarter.style.transform = "";
      insideStarter.style.opacity = "";

      resetTreeAnimation();

      if(initial){
        insideStarter.classList.remove("hide");
      }
    }

    async function runAnimation(){
      if(isRunning) return;
      isRunning = true;

      replayArea.classList.remove("show");
      insideStarter.classList.remove("hide");
      insideStarter.classList.add("drop");

      await wait(900);

      insideStarter.classList.add("hide");
      insideStarter.classList.remove("drop");
      insideStarter.style.transform = "";
      insideStarter.style.opacity = "";

      currentTree.classList.add("start");

      startCounter();

      await wait(1800);
      await fillHeart();

      await wait(250);
      startFallingLeaves();

      await wait(260);
      await writeMessage();

      await wait(450);
      counterBox.classList.add("show");

      await wait(900);
      replayArea.classList.add("show");

      isRunning = false;
    }

    async function playMusicAndRun(){
      bgMusic.currentTime = 0;
      bgMusic.play().catch(err => console.log("Audio bloqueado:", err));
      clearScene();
      await runAnimation();
    }

    startBtn.addEventListener("click", playMusicAndRun);
    restartBtn.addEventListener("click", playMusicAndRun);

    clearScene(true);
  </script>
</body>
</html>
